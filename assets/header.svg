<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#312e81;#0f766e;#0f172a" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1e1b4b">
        <animate attributeName="stop-color" values="#1e1b4b;#312e81;#0f766e;#1e293b;#1e1b4b" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0284c7">
        <animate attributeName="stop-color" values="#0284c7;#6366f1;#ec4899;#06b6d4;#0284c7" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="txt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 38px; font-weight: 800; fill: url(#txt); }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 17px; font-weight: 500; fill: #e2e8f0; }
    .tag { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #38bdf8; }
    .tag-bg { fill: rgba(255, 255, 255, 0.12); stroke: rgba(255, 255, 255, 0.25); stroke-width: 1; rx: 12; }
  </style>

  <!-- Background Card -->
  <rect width="850" height="220" rx="16" fill="url(#bg)" />

  <!-- Animated Decorative Circles -->
  <circle cx="750" cy="50" r="120" fill="#38bdf8" opacity="0.12">
    <animate attributeName="r" values="100;130;100" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="100" cy="180" r="80" fill="#ec4899" opacity="0.1">
    <animate attributeName="r" values="70;95;70" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Title Text -->
  <text x="425" y="85" text-anchor="middle" class="title" filter="url(#glow)">Hey there, I'm Adwaith! 👋</text>

  <!-- Subtitle -->
  <text x="425" y="125" text-anchor="middle" class="subtitle">Full-Stack MERN Developer • Tech Explorer • Problem Solver</text>

  <!-- Tag Pills -->
  <g transform="translate(170, 155)">
    <rect x="0" y="0" width="150" height="28" class="tag-bg" />
    <text x="75" y="19" text-anchor="middle" class="tag">⚡ React &amp; Node.js</text>
  </g>
  <g transform="translate(340, 155)">
    <rect x="0" y="0" width="170" height="28" class="tag-bg" />
    <text x="85" y="19" text-anchor="middle" class="tag">🛒 ALTIER-ECOMM</text>
  </g>
  <g transform="translate(530, 155)">
    <rect x="0" y="0" width="150" height="28" class="tag-bg" />
    <text x="75" y="19" text-anchor="middle" class="tag">🤖 IoT &amp; Hardware</text>
  </g>
</svg>