name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# Explicitly grant the workflow write access to push to the output branch
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Generate Snake with Black Background
      - name: generate-snake-game-from-github-contribution-grid
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?color_dots=#000000,#0e4429,#006d32,#26a641,#39d353
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

      # Step 2: Speed up snake animation (2x faster)
      - name: Speed up snake animation
        run: |
          sudo chmod -R a+rw dist
          python3 -c "
          import re, glob
          SPEED_FACTOR = 0.5
          for f in glob.glob('dist/*.svg'):
              with open(f, 'r+') as fp:
                  content = fp.read()
                  content = re.sub(r'(\d+)ms', lambda m: f'{int(int(m.group(1)) * SPEED_FACTOR)}ms', content)
                  fp.seek(0)
                  fp.write(content)
                  fp.truncate()
          "

      # Step 3: Deploy to output branch using write token
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
